<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
      background: #2179c8;
      font-family: 'Inter', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .card {
      width: 1200px;
      height: 630px;
      background: #2179c8;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 72px 80px;
      position: relative;
      overflow: hidden;
    }
    /* Background mesh dots */
    .card::before {
      content: '';
      position: absolute;
      top: 0; right: 0;
      width: 600px;
      height: 630px;
      background-image: radial-gradient(circle, rgba(255,255,255,0.12) 1.5px, transparent 1.5px);
      background-size: 40px 40px;
      pointer-events: none;
    }
    .logo-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .logo-text {
      font-size: 22px;
      font-weight: 600;
      color: #fff;
      letter-spacing: -0.01em;
    }
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
    }
    .eyebrow {
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.5);
      margin-bottom: 24px;
    }
    h1 {
      font-size: 72px;
      font-weight: 300;
      line-height: 1.08;
      letter-spacing: -0.03em;
      color: #fff;
      margin-bottom: 24px;
    }
    h1 strong { font-weight: 600; }
    .sub {
      font-size: 22px;
      color: rgba(255,255,255,0.62);
      font-weight: 400;
      line-height: 1.5;
      max-width: 560px;
    }
    .footer-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .domain {
      font-size: 16px;
      color: rgba(255,255,255,0.4);
      font-weight: 400;
    }
    .badge {
      font-size: 13px;
      color: rgba(255,255,255,0.5);
      border: 1px solid rgba(255,255,255,0.2);
      padding: 6px 14px;
      border-radius: 20px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-row">
      <svg width="36" height="36" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
        <g transform="translate(7,8)">
          <polygon points="6,0 0,10 4,10 1,17 10,6 5,6" fill="rgba(255,255,255,0.95)"/>
          <rect x="11" y="14" width="8" height="2.5" rx="1.25" fill="rgba(255,255,255,0.95)"/>
        </g>
      </svg>
      <span class="logo-text">Cloudflash</span>
    </div>

    <div class="main">
      <p class="eyebrow">Relaunching 2026</p>
      <h1><strong>Cloudflash</strong><br>is launching.</h1>
      <p class="sub">A new generation of AI-assisted products — web, desktop, mobile, and email.</p>
    </div>

    <div class="footer-row">
      <span class="domain">cloudflash.com</span>
      <span class="badge">Learn more at cloudflash.com →</span>
    </div>
  </div>
</body>
</html>
