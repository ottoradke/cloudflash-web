<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Preview — The Daily Fintech Briefing</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:     #2179c8;
      --border: rgba(255,255,255,0.18);
      --text:   #ffffff;
      --muted:  rgba(255,255,255,0.62);
    }

    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
    }

    body { min-height: 100vh; display: flex; flex-direction: column; }

    .page {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      padding: 0 40px;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 36px 0;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.95rem;
      font-weight: 500;
    }

    .logo-icon { width: 28px; height: 28px; flex-shrink: 0; }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    .cursor-blink { animation: blink 1.8s step-end infinite; }
    .logo-sep { color: var(--border); font-weight: 300; margin: 0 2px; }
    .logo-product { font-weight: 400; color: var(--muted); }

    .back-link {
      font-size: 0.78rem;
      color: var(--muted);
      text-decoration: none;
      transition: color 0.15s;
    }
    .back-link:hover { color: var(--text); }

    main { padding: 40px 0 60px; flex: 1; }

    .eyebrow {
      font-size: 0.72rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 500;
      margin-bottom: 16px;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 300;
      letter-spacing: -0.02em;
      margin-bottom: 32px;
    }

    .key-row {
      display: flex;
      gap: 10px;
      max-width: 480px;
      margin-bottom: 32px;
    }

    .key-row input {
      flex: 1;
      background: rgba(255,255,255,0.12);
      border: 1px solid var(--border);
      border-radius: 4px;
      padding: 9px 14px;
      font-size: 0.85rem;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      outline: none;
    }

    .key-row input::placeholder { color: rgba(255,255,255,0.4); }
    .key-row input:focus { border-color: rgba(255,255,255,0.5); background: rgba(255,255,255,0.16); }

    .btn-row {
      display: flex;
      gap: 10px;
      margin-bottom: 12px;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 4px;
      font-size: 0.88rem;
      font-weight: 600;
      font-family: 'Inter', sans-serif;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s;
    }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .btn-mock {
      background: rgba(255,255,255,0.95);
      color: #1a5fa8;
    }
    .btn-mock:hover { background: #fff; }

    .btn-fetch {
      background: rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.85);
      border: 1px solid rgba(255,255,255,0.35);
    }
    .btn-fetch:hover { background: rgba(255,255,255,0.22); }

    .btn-live {
      background: rgba(255,255,255,0.15);
      color: rgba(255,255,255,0.85);
      border: 1px solid rgba(255,255,255,0.35);
    }
    .btn-live:hover { background: rgba(255,255,255,0.22); }

    .status {
      font-size: 0.82rem;
      color: var(--muted);
      min-height: 1.2em;
      margin-bottom: 24px;
    }

    .status.error { color: #ffaaaa; }

    .preview-wrap {
      background: #f0f0f0;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 4px 32px rgba(0,0,0,0.2);
      display: none;
    }

    #preview-frame {
      width: 100%;
      border: none;
      display: block;
      min-height: 400px;
    }

    .logs-section { margin-top: 56px; }

    .logs-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
      flex-wrap: wrap;
      gap: 12px;
    }

    .logs-header h2 {
      font-size: 1rem;
      font-weight: 500;
    }

    .period-tabs {
      display: flex;
      gap: 6px;
    }

    .period-tab {
      font-size: 0.72rem;
      font-weight: 500;
      font-family: 'Inter', sans-serif;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      padding: 5px 12px;
      border-radius: 4px;
      border: 1px solid var(--border);
      background: transparent;
      color: var(--muted);
      cursor: pointer;
      transition: background 0.15s, color 0.15s, border-color 0.15s;
    }

    .period-tab:hover { color: var(--text); border-color: rgba(255,255,255,0.35); }
    .period-tab.active {
      background: rgba(255,255,255,0.95);
      color: #1a5fa8;
      border-color: transparent;
    }

    .logs-cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 16px;
    }

    .log-card {
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 16px 18px;
    }

    .log-card-service {
      font-size: 0.7rem;
      color: var(--muted);
      font-weight: 500;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .log-card-count {
      font-size: 1.8rem;
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1;
      margin-bottom: 6px;
    }

    .log-card-failures {
      font-size: 0.75rem;
      color: #ffaaaa;
      min-height: 1em;
    }

    .log-card-limit {
      font-size: 0.72rem;
      color: var(--muted);
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--border);
    }

    .logs-loading { font-size: 0.85rem; color: var(--muted); margin-top: 12px; }

    @media (max-width: 600px) {
      .logs-cards { grid-template-columns: repeat(2, 1fr); }
    }

    footer {
      display: flex;
      justify-content: space-between;
      padding: 28px 40px 36px;
      border-top: 1px solid var(--border);
      font-size: 0.75rem;
      color: var(--muted);
      max-width: 900px;
      margin: 0 auto;
      width: 100%;
    }
  </style>
</head>
<body>

  <div class="page">
    <header>
      <div class="logo">
        <svg class="logo-icon" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
          <g transform="translate(7,8)">
            <polygon points="6,0 0,10 4,10 1,17 10,6 5,6" fill="rgba(255,255,255,0.95)"/>
            <rect class="cursor-blink" x="11" y="14" width="8" height="2.5" rx="1.25" fill="rgba(255,255,255,0.95)"/>
          </g>
        </svg>
        Cloudflash
        <span class="logo-sep">/</span>
        <span class="logo-product">Admin Preview</span>
      </div>
      <a href="/fintech" class="back-link">← fintech</a>
    </header>

    <main>
      <p class="eyebrow">Internal tool</p>
      <h1>Email preview</h1>

      <div class="key-row">
        <input type="password" id="key-input" placeholder="Preview key" autocomplete="off" />
      </div>

      <div class="btn-row">
        <button class="btn-mock" id="btn-mock">Mock preview</button>
        <button class="btn-fetch" id="btn-fetch">Fetch articles</button>
        <button class="btn-live" id="btn-live">Live preview</button>
      </div>

      <p class="status" id="status"></p>

      <div class="preview-wrap" id="preview-wrap">
        <iframe id="preview-frame" title="Email preview" sandbox="allow-same-origin"></iframe>
      </div>

      <div class="logs-section">
        <div class="logs-header">
          <h2>API usage</h2>
          <div class="period-tabs" id="period-tabs">
            <button class="period-tab active" data-period="1d">1 day</button>
            <button class="period-tab" data-period="7d">7 days</button>
            <button class="period-tab" data-period="14d">14 days</button>
            <button class="period-tab" data-period="21d">21 days</button>
            <button class="period-tab" data-period="28d">28 days</button>
          </div>
        </div>
        <p class="logs-loading" id="logs-loading">Loading...</p>
        <div class="logs-cards" id="logs-cards" style="display:none">
          <div class="log-card" id="card-tavily">
            <div class="log-card-service">Tavily</div>
            <div class="log-card-count" id="count-tavily">—</div>
            <div class="log-card-failures" id="failures-tavily"></div>
            <div class="log-card-limit">1,000 / month</div>
          </div>
          <div class="log-card" id="card-anthropic">
            <div class="log-card-service">Anthropic</div>
            <div class="log-card-count" id="count-anthropic">—</div>
            <div class="log-card-failures" id="failures-anthropic"></div>
            <div class="log-card-limit">Pay-as-you-go · No cap</div>
          </div>
          <div class="log-card" id="card-finnhub">
            <div class="log-card-service">Finnhub</div>
            <div class="log-card-count" id="count-finnhub">—</div>
            <div class="log-card-failures" id="failures-finnhub"></div>
            <div class="log-card-limit">No monthly cap · 30 req/sec</div>
          </div>
          <div class="log-card" id="card-resend">
            <div class="log-card-service">Resend</div>
            <div class="log-card-count" id="count-resend">—</div>
            <div class="log-card-failures" id="failures-resend"></div>
            <div class="log-card-limit">50,000 / month · 5 req/sec</div>
          </div>
        </div>
      </div>
    </main>
  </div>

  <footer>
    <span>© 2026 Cloudflash, Inc.</span>
    <span>Internal use only</span>
  </footer>

  <script>
    const keyInput = document.getElementById('key-input');
    const btnMock  = document.getElementById('btn-mock');
    const btnFetch = document.getElementById('btn-fetch');
    const btnLive  = document.getElementById('btn-live');
    const status   = document.getElementById('status');
    const wrap     = document.getElementById('preview-wrap');
    const frame    = document.getElementById('preview-frame');

    // Restore saved key
    const saved = localStorage.getItem('preview_key');
    if (saved) keyInput.value = saved;

    async function loadPreview(endpoint) {
      const key = keyInput.value.trim();
      if (!key) { status.textContent = 'Enter your preview key first.'; status.className = 'status error'; return; }

      localStorage.setItem('preview_key', key);
      status.textContent = endpoint === 'preview' ? 'Loading mock preview…' : 'Loading live preview — this may take 20–30 seconds…';
      status.className = 'status';
      btnMock.disabled = true;
      btnFetch.disabled = true;
      btnLive.disabled = true;
      wrap.style.display = 'none';

      try {
        const res = await fetch(`https://api.cloudflash.com/${endpoint}?key=${encodeURIComponent(key)}`);
        if (res.status === 401) { status.textContent = 'Invalid key.'; status.className = 'status error'; return; }
        if (res.status === 404) { status.textContent = 'No pipeline run found. Run the pipeline first.'; status.className = 'status error'; return; }
        if (!res.ok) { status.textContent = 'Server error. Try again.'; status.className = 'status error'; return; }

        const html = await res.text();
        const doc = frame.contentDocument || frame.contentWindow.document;
        doc.open(); doc.write(html); doc.close();

        wrap.style.display = 'block';
        status.textContent = '';

        setTimeout(() => {
          frame.style.height = doc.documentElement.scrollHeight + 'px';
        }, 100);
      } catch {
        status.textContent = 'Request failed. Check your connection.';
        status.className = 'status error';
      } finally {
        btnMock.disabled = false;
        btnFetch.disabled = false;
        btnLive.disabled = false;
      }
    }

    btnFetch.addEventListener('click', async () => {
      const key = keyInput.value.trim();
      if (!key) { status.textContent = 'Enter your preview key first.'; status.className = 'status error'; return; }

      localStorage.setItem('preview_key', key);
      status.textContent = 'Fetching articles from Tavily — this may take 15–20 seconds…';
      status.className = 'status';
      btnMock.disabled = true;
      btnFetch.disabled = true;
      btnLive.disabled = true;

      try {
        const res = await fetch(`https://api.cloudflash.com/pipeline/fetch?key=${encodeURIComponent(key)}`);
        if (res.status === 401) { status.textContent = 'Invalid key.'; status.className = 'status error'; return; }
        if (!res.ok) { status.textContent = 'Server error. Try again.'; status.className = 'status error'; return; }
        const data = await res.json();
        status.textContent = `Fetched ${data.articles} articles for ${data.date}. Ready for live preview.`;
      } catch {
        status.textContent = 'Request failed. Check your connection.';
        status.className = 'status error';
      } finally {
        btnMock.disabled = false;
        btnFetch.disabled = false;
        btnLive.disabled = false;
      }
    });

    btnMock.addEventListener('click', () => loadPreview('preview'));
    btnLive.addEventListener('click', () => loadPreview('preview/live'));
  </script>

  <script>
    (function () {
      const loading  = document.getElementById('logs-loading');
      const cards    = document.getElementById('logs-cards');
      const tabs     = document.querySelectorAll('.period-tab');
      const services = ['tavily', 'anthropic', 'finnhub', 'resend'];
      let logData    = null;
      let activePeriod = '1d';

      function render(period) {
        if (!logData) return;
        services.forEach(service => {
          const { calls, failures } = logData[service]?.[period] ?? { calls: 0, failures: 0 };
          document.getElementById(`count-${service}`).textContent = calls.toLocaleString();
          const failEl = document.getElementById(`failures-${service}`);
          failEl.textContent = failures > 0 ? `${failures} failed` : '';
        });
      }

      tabs.forEach(tab => {
        tab.addEventListener('click', () => {
          tabs.forEach(t => t.classList.remove('active'));
          tab.classList.add('active');
          activePeriod = tab.dataset.period;
          render(activePeriod);
        });
      });

      fetch('https://api.cloudflash.com/api/logs')
        .then(r => r.json())
        .then(data => {
          logData = data;
          loading.remove();
          cards.style.display = 'grid';
          render(activePeriod);
        })
        .catch(() => {
          loading.textContent = 'Failed to load usage data.';
        });
    })();
  </script>

</body>
</html>
