name = "cloudflash-briefing"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[triggers]
# 7:30am PDT (UTC-7): "30 14 * * 1-5" — active April–October
# 7:30am PST (UTC-8): "30 15 * * 1-5" — switch on Nov 1, 2026 (and each Nov thereafter)
crons = ["30 14 * * 1-5"]

[vars]
# Secrets are stored via `wrangler secret put` — not here.
# Listed for reference only: ANTHROPIC_API_KEY, RESEND_API_KEY, TAVILY_API_KEY, VERCEL_DEPLOY_HOOK

[[d1_databases]]
binding = "DB"
database_name = "briefing-db"
database_id = "4f6e864a-cbc0-4e11-9988-c68f84a7ca3c"
