name = "cloudflash-briefing"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[triggers]
# Disabled 2026-04-19: newsletter migrated to BriefTen (brieften.com).
# BriefTen now handles all sends. Do not re-enable without coordinating
# with that project to avoid double-sending to migrated subscribers.
# crons = ["30 14 * * 2-6"]
crons = []

[vars]
# Secrets are stored via `wrangler secret put` — not here.
# Listed for reference only: ANTHROPIC_API_KEY, RESEND_API_KEY, TAVILY_API_KEY, VERCEL_DEPLOY_HOOK

[observability]
enabled = true

[observability.logs]
enabled = true
invocation_logs = true

[observability.traces]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "briefing-db"
database_id = "4f6e864a-cbc0-4e11-9988-c68f84a7ca3c"
